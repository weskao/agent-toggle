[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-toggle"
dynamic = ["version"]
description = "Temporarily disable / re-enable AI-agent skills, agents, commands, rules, plugins and MCP servers across harnesses (Claude Code, Codex, Grok, OpenCode, OpenClaw, Copilot, Vibe, Devin, Antigravity)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai-agents", "claude-code", "codex", "skills", "mcp", "cli", "toggle"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/weskao/agent-toggle"
Repository = "https://github.com/weskao/agent-toggle"
Issues = "https://github.com/weskao/agent-toggle/issues"
Changelog = "https://github.com/weskao/agent-toggle/blob/main/CHANGELOG.md"

[project.optional-dependencies]
windows = ["windows-curses; sys_platform == 'win32'"]
telegram = ["telegram-kit>=0.2.2,<0.3"]

[project.scripts]
agent-toggle = "agent_toggle.cli:main"

[tool.setuptools]
packages = ["agent_toggle", "agent_toggle.backends", "agent_toggle.locales", "agent_toggle.ui"]

[tool.setuptools.package-data]
agent_toggle = ["shims/*.tmpl"]

[tool.setuptools.dynamic]
# `.__init__` because setuptools resolves `agent_toggle` to the root
# agent_toggle.py wrapper before the package directory.
version = { attr = "agent_toggle.__init__.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pinned instead of ruff's moving default set, so a ruff upgrade cannot turn
# CI red on unchanged code.
select = ["E4", "E7", "E9", "F", "I", "W"]
