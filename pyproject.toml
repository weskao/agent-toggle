[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-toggle"
dynamic = ["version"]
description = "Temporarily disable / re-enable AI-agent skills, agents, commands, plugins and MCP servers across harnesses"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
windows = ["windows-curses; sys_platform == 'win32'"]

[project.scripts]
agent-toggle = "agent_toggle.cli:main"

[tool.setuptools]
packages = ["agent_toggle", "agent_toggle.backends", "agent_toggle.ui"]

[tool.setuptools.package-data]
agent_toggle = ["shims/*.tmpl"]

[tool.setuptools.dynamic]
# `.__init__` because setuptools resolves `agent_toggle` to the root
# agent_toggle.py wrapper before the package directory.
version = { attr = "agent_toggle.__init__.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pinned instead of ruff's moving default set, so a ruff upgrade cannot turn
# CI red on unchanged code.
select = ["E4", "E7", "E9", "F", "I", "W"]
