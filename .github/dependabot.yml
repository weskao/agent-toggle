version: 2
updates:
  # Actions stay pinned by commit SHA with a "# vX.Y.Z" comment; Dependabot
  # understands that form and bumps both the SHA and the comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  # dependencies = [] at the top level; telegram-kit and windows-curses only
  # come in through the telegram/windows extras, so pip is still worth tracking.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
