name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # Windows creates symlinks only with Developer Mode (or an elevated
      # privilege); without it tests/base.py CAN_SYMLINK is False and the
      # symlink tests skip. The registry flag is read at os.symlink() time, so
      # no reboot is needed. The skipUnless guards stay for local Windows users.
      - name: Enable symlink creation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
      # Installs every extra declared in pyproject.toml's
      # [project.optional-dependencies] (currently windows, telegram), so a
      # new extra is picked up here automatically — no edit needed. A marker
      # that doesn't match the current OS (e.g. windows-curses) just no-ops.
      - name: Install package with all extras
        shell: python
        run: |
          import re, subprocess, pathlib
          text = pathlib.Path("pyproject.toml").read_text()
          m = re.search(r"\[project\.optional-dependencies\]\n(.*?)\n\[", text, re.S)
          extras = re.findall(r"^(\w+)\s*=", m.group(1), re.M) if m else []
          spec = f".[{','.join(extras)}]" if extras else "."
          subprocess.check_call(["pip", "install", "-e", spec])
      - run: python -m unittest discover -s tests -v

  # What a PyPI user gets: the built wheel, no extras, outside the checkout.
  wheel-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python tools/wheel_smoke.py

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install ruff uv
      - run: ruff check .
      # uv.lock is tracked: fail when pyproject.toml changed without a relock.
      - run: uv lock --check

  # Failure-only pager: a green run sends nothing, on purpose. The message and
  # the missing-secrets skip live in notify-telegram.yml (shared with release.yml).
  notify-telegram:
    needs: [test, wheel-smoke]
    if: ${{ failure() && github.event_name == 'push' }}
    uses: ./.github/workflows/notify-telegram.yml
    with:
      title: CI failed
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
