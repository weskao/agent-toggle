name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # Windows creates symlinks only with Developer Mode (or an elevated
      # privilege); without it tests/base.py CAN_SYMLINK is False and the
      # symlink tests skip. The registry flag is read at os.symlink() time, so
      # no reboot is needed. The skipUnless guards stay for local Windows users.
      - name: Enable symlink creation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
      # Installs every extra declared in pyproject.toml's
      # [project.optional-dependencies] (currently windows, telegram), so a
      # new extra is picked up here automatically — no edit needed. A marker
      # that doesn't match the current OS (e.g. windows-curses) just no-ops.
      - name: Install package with all extras
        shell: python
        run: |
          import re, subprocess, pathlib
          text = pathlib.Path("pyproject.toml").read_text()
          m = re.search(r"\[project\.optional-dependencies\]\n(.*?)\n\[", text, re.S)
          extras = re.findall(r"^(\w+)\s*=", m.group(1), re.M) if m else []
          spec = f".[{','.join(extras)}]" if extras else "."
          subprocess.check_call(["pip", "install", "-e", spec])
      - run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  # Failure-only pager: a green run sends nothing, on purpose. Credentials live
  # in repo secrets, never in this file; see README "CI notifications".
  notify-telegram:
    needs: test
    if: ${{ failure() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Unset secrets are a valid state (a fork, or an owner who never set
          # them). Skip instead of adding a second, misleading red X.
          if [ -z "$TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::notice::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set, skipping notification"
            exit 0
          fi
          # parse_mode=HTML: an unescaped < & > in a branch name makes Telegram
          # answer 400. Escape & first so the later entities are not re-escaped.
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          ci_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          message="🚨 <b>CI failed</b>

          <b>Repository:</b> <code>$(esc "$GITHUB_REPOSITORY")</code>
          <b>Branch:</b> <code>$(esc "$GITHUB_REF_NAME")</code>
          <b>Commit:</b> <code>$(esc "${GITHUB_SHA::7}")</code>

          <a href=\"$ci_url\">Open failed CI run</a>"
          curl --fail --silent --show-error --max-time 30 \
            --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=$message" \
            "https://api.telegram.org/bot$TOKEN/sendMessage"
